name: Extract Serie A starting XIs (FotMob HTML)

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to extract"
        required: true
        default: "2021-22"
        type: choice
        options:
          - "2021-22"
          - "2022-23"
          - "2023-24"
          - "2024-25"
          - "2025-26"
          - "all"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract lineups
        run: python extract_serie_a_lineups.py --season "${{ inputs.season }}"

      - name: Show coverage
        if: always()
        run: |
          echo "Processed files:"
          ls -lh data/processed || true
          echo
          cat data/processed/serie_a_lineup_coverage.csv | tail -20 || true

      - name: Upload CSV outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serie-a-lineups-${{ inputs.season }}
          path: |
            data/processed/*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failed-match HTML cache
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-html-${{ inputs.season }}
          path: |
            data/raw/fotmob/
          if-no-files-found: ignore
          retention-days: 7
