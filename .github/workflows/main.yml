name: Extract Serie A starting XIs (FotMob v7)

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to extract"
        required: true
        default: "2021-22"
        type: choice
        options:
          - "2021-22"
          - "2022-23"
          - "2023-24"
          - "2024-25"
          - "2025-26"
          - "all"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract lineups
        run: |
          python extract_serie_a_lineups.py \
            --season "${{ inputs.season }}"

      - name: Show coverage
        if: always()
        run: |
          echo "Processed files:"
          ls -lh data/processed || true
          echo
          if [ -f data/processed/serie_a_lineup_coverage.csv ]; then
            python - <<'PY'
          import pandas as pd
          p="data/processed/serie_a_lineup_coverage.csv"
          df=pd.read_csv(p)
          print(df.groupby("Season").agg(
              matches=("MatchID","size"),
              complete=("CompleteXI","sum"),
              avg_home=("HomeStarters","mean"),
              avg_away=("AwayStarters","mean"),
          ))
          PY
          fi

      - name: Upload CSV outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serie-a-lineups-v7-${{ inputs.season }}
          path: |
            data/processed/*.csv
          if-no-files-found: warn
          retention-days: 30
