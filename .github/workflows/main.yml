name: Diagnose FotMob Serie A lineup structure (v6)

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to inspect"
        required: true
        default: "2021-22"
        type: choice
        options:
          - "2021-22"
          - "2022-23"
          - "2023-24"
          - "2024-25"
          - "2025-26"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose first match only
        run: |
          python diagnose_fotmob_lineup.py \
            --season "${{ inputs.season }}"

      - name: Show diagnostic files
        if: always()
        run: |
          echo "Diagnostic files:"
          find data/diagnostics -maxdepth 1 -type f -printf "%f  %s bytes\n" | sort || true
          echo
          echo "Candidate containers:"
          cat data/diagnostics/candidate_containers.txt || true
          echo
          echo "Keyword paths:"
          head -200 data/diagnostics/keyword_paths.txt || true

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotmob-lineup-diagnostics-${{ inputs.season }}
          path: data/diagnostics/
          if-no-files-found: warn
          retention-days: 14
